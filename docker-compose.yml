version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: librecrawl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: librecrawl
      POSTGRES_PASSWORD: librecrawl_password
      POSTGRES_DB: librecrawl
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U librecrawl"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - librecrawl-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: librecrawl-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://librecrawl:librecrawl_password@postgres:5432/librecrawl?schema=public
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      SESSION_SECRET: ${SESSION_SECRET:-your-super-secret-session-key-change-in-production}
      LOCAL_MODE: ${LOCAL_MODE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - librecrawl-network
    volumes:
      # Optional: Mount for persistent crawl data
      - crawl-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres-data:
    driver: local
  crawl-data:
    driver: local

networks:
  librecrawl-network:
    driver: bridge
